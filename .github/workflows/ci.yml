# npm run check, then the e2e suite (mocked: no secrets, no upstream traffic), on main, on PRs, and on demand.
# Actions are pinned by commit, as this workflow will later gate merges. No traces are uploaded:
# the repo is public.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs a branch without a PR: gh workflow run CI --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Its own job, so it runs beside check rather than after it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - run: |
          { echo '```'; node scripts/journey-coverage.js --results=e2e-results.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        if: success() || failure()
      # The page's accessibility snapshot at each failure (mocked fixtures only), since no traces are kept.
      - run: find test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
        if: failure()
