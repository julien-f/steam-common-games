# The UX-workflow pilot's guard (scripts/guard.js) on each PR. pull_request_target runs this file and
# the guard from main, so a PR can't change its own judge. It still runs the PR's tests, which is
# untrusted code: read-only token, no secrets, no cache, no persisted credentials.
name: Guard

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/guard/head"
        env:
          PR: ${{ github.event.pull_request.number }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/guard.js --base=HEAD --head=refs/guard/head --run | tee -a "$GITHUB_STEP_SUMMARY"
